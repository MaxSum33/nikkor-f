<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>说明书下载 · 尼康 F 卡口资料库</title>
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#15171c;--muted:#69707d;--line:#e6e8ec;--accent:#f2c200;--accent-soft:#fff6cc;--chip:#eef0f3;--shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.top{position:sticky;top:0;z-index:30;background:#111318;color:#fff;border-bottom:3px solid var(--accent);padding:10px 22px 0}
.toprow{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-bottom:8px;min-height:56px}
.brand h1{font-size:17px;margin:0;font-weight:700}
.brand p{margin:2px 0 0;font-size:12px;color:#a9b0bd}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#q{width:280px;max-width:52vw;padding:8px 12px;border-radius:9px;border:1px solid #2c313b;background:#1b1e25;color:#fff;outline:none;font-size:13px}
#q::placeholder{color:#7d8593}
button{font:inherit;font-size:13px;cursor:pointer;border-radius:9px;border:1px solid #2c313b;background:#1b1e25;color:#e8eaee;padding:8px 13px}
button:hover{background:#252932}
.nav{display:flex;gap:2px;overflow:auto}
.nav a{color:#c8cdd6;text-decoration:none;font-size:13px;padding:8px 14px;border-radius:9px 9px 0 0;white-space:nowrap}
.nav a:hover{background:#1b1e25}
.nav a.on{background:var(--bg);color:#111;font-weight:700}
main{padding:16px 20px 20px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{border-radius:99px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.statline{display:flex;align-items:baseline;gap:10px;font-size:13px;color:var(--muted);margin:4px 0 10px}
.statline b{font-size:20px;color:var(--ink)}
.statline .sp{flex:1}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 250px)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
thead th{position:sticky;top:0;z-index:5;background:#fafbfc;text-align:left;white-space:nowrap;padding:9px 10px;border-bottom:1px solid var(--line);font-size:11.5px;color:#555c68}
tbody td{padding:8px 10px;border-bottom:1px solid #f0f1f3;white-space:nowrap}
tbody tr:nth-child(even){background:#fcfcfd}
tbody tr:hover{background:var(--accent-soft)}
td.model{font-weight:600}
a.man{color:#1f4a73;text-decoration:none}
a.man:hover{text-decoration:underline}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;background:var(--chip);color:#4a515c}
.muted{color:var(--muted)}
.foot{margin:14px 2px 0;font-size:11.5px;color:var(--muted);line-height:1.7}
@media (max-width:960px){.tablewrap{max-height:none}#q{width:160px}td.hide-sm,th.hide-sm{display:none}}
@media (max-width:640px){.brand h1{font-size:15px}td.hide-xs,th.hide-xs{display:none}.nav{flex-wrap:wrap}.nav a{padding:7px 10px;font-size:12.5px}}

#site-footer{margin:28px 20px 34px;padding-top:14px;border-top:1px solid #e6e8ec;
  display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;
  font-size:12px;color:#69707d}
#site-footer b{color:#15171c;font-weight:700}
#site-footer a{color:#1f4a73;text-decoration:none}
#site-footer a:hover{text-decoration:underline}
html[data-theme="dark"] #site-footer{color:#9aa4b2;border-top-color:#252b35}
html[data-theme="dark"] #site-footer b{color:#e7eaf0}
html[data-theme="dark"] #site-footer a{color:#8fb8e8}
html[data-theme="dark"] .item ul,html[data-theme="dark"] .item li{color:#c6cdd8}
html[data-theme="dark"] .item h3{color:#e7eaf0}
html[data-theme="dark"] .sub,html[data-theme="dark"] .date,html[data-theme="dark"] .lastup{color:#9aa4b2}
html[data-theme="dark"] .v code{background:#e7eaf0;color:#111}
html[data-theme="dark"] thead th{background:#1a1f27;color:#c3cbd6}
html[data-theme="dark"] #empty-hint{background:#2c2716;border-color:#5a5122;color:#f0d97a}
html[data-theme="dark"] .tabs button{background:#151920;color:#c3cbd6;border-color:#252b35}
html[data-theme="dark"] .tabs button.on{background:#e7eaf0;color:#111;border-color:#e7eaf0}
</style>

<style id="nav-fix">
/* 导航：任何宽度都允许换行，避免第 5、6 项被挤出屏幕 */
.top .nav{display:flex;flex-wrap:wrap;overflow:visible;row-gap:4px}
.top .nav a{white-space:nowrap}
@media (max-width:960px){
  .top .nav a{padding:7px 10px;font-size:12.5px}
}
</style>
<style id="theme-css">
html[data-theme="dark"]{
  --bg:#0d1015; --panel:#151920; --ink:#e7eaf0; --muted:#98a2b0; --line:#252b35;
  --chip:#1e232b; --accent-soft:#33301a; --ink2:#dfe3ea; --accent:#f2c200;
  background:#0d1015;
}
html[data-theme="dark"] body{background:var(--bg);color:var(--ink)}
html[data-theme="dark"] thead th{background:#1a1f27;color:#a9b3c0;border-bottom-color:var(--line)}
html[data-theme="dark"] tbody td{border-bottom-color:#222833}
html[data-theme="dark"] tbody tr:nth-child(even){background:#12161c}
html[data-theme="dark"] tbody tr:hover{background:#2a2718}
html[data-theme="dark"] .tablewrap,html[data-theme="dark"] .gantt,html[data-theme="dark"] aside,
html[data-theme="dark"] .card,html[data-theme="dark"] .drawer,html[data-theme="dark"] .wrap{background:var(--panel)}
html[data-theme="dark"] .tag{background:var(--chip);color:#b9c2cf}
html[data-theme="dark"] .tag.gold{background:#33301a;color:#f0d97a;border-color:#5a5122}
html[data-theme="dark"] .tag.dx{background:#1b2a3f;color:#8fb8e8}
html[data-theme="dark"] .tag.warn{background:#3a3016;border-color:#6b5a22;color:#f0d97a}
html[data-theme="dark"] .mt.full{background:#16301f;color:#8fe0ac}
html[data-theme="dark"] .mt.part{background:#3a3016;color:#f0d97a}
html[data-theme="dark"] .mt.no{background:#232830;color:#8a94a2}
html[data-theme="dark"] .stars .dim{color:#3a414d}
html[data-theme="dark"] .range input{background:#1b2028;color:var(--ink);border-color:var(--line)}
html[data-theme="dark"] .chip{background:var(--chip);color:#b9c2cf}
html[data-theme="dark"] .chip.on{background:#e7eaf0;color:#111;border-color:#e7eaf0}
html[data-theme="dark"] .seg{background:var(--chip)}
html[data-theme="dark"] .seg button{color:#aab3bf}
html[data-theme="dark"] .seg button.on{background:#2a303a;color:#fff;box-shadow:none}
html[data-theme="dark"] .tabs button{background:var(--panel);border-color:var(--line);color:#b9c2cf}
html[data-theme="dark"] .tabs button.on{background:#e7eaf0;color:#111;border-color:#e7eaf0}
html[data-theme="dark"] .nav a.on{background:#e7eaf0;color:#111}
html[data-theme="dark"] .g-head{background:#1a1f27}
html[data-theme="dark"] .g-head .g-lab{background:#1a1f27;border-right-color:var(--line)}
html[data-theme="dark"] .g-lab{background:var(--panel);border-right-color:var(--line);color:#c6cdd8}
html[data-theme="dark"] .g-row:hover .g-lab{background:#2a2718}
html[data-theme="dark"] .g-stitle{background:#1a1f27;color:#a9b3c0}
html[data-theme="dark"] .g-row{border-bottom-color:#1f242c}
html[data-theme="dark"] .d-head{background:var(--panel);border-bottom-color:var(--line)}
html[data-theme="dark"] .d-close{background:#232830;border-color:var(--line);color:#c6cdd8}
html[data-theme="dark"] .acctab td,html[data-theme="dark"] .acctab th{border-bottom-color:#222833}
html[data-theme="dark"] a.rv.alt{background:#232830;color:#c6cdd8}
html[data-theme="dark"] .empty{color:var(--muted)}
html[data-theme="dark"] .bread,html[data-theme="dark"] .foot{color:var(--muted)}
html[data-theme="dark"] .hint,html[data-theme="dark"] .muted,html[data-theme="dark"] .d-kv dt{color:#98a2b0}
html[data-theme="dark"] #site-footer{color:#98a2b0}
html[data-theme="dark"] .acctab th{background:#1a1f27;color:#a9b3c0}
#themeBtn{
  position:fixed;right:18px;bottom:18px;width:44px;height:44px;border-radius:50%;
  border:1px solid #cfd4db;background:#fff;color:#111;font-size:18px;line-height:1;
  cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:80;
}
html[data-theme="dark"] #themeBtn{background:#1e232b;color:#f2c200;border-color:#3a414d}
@media (max-width:640px){
  .nav{flex-wrap:wrap}
  .nav a{padding:7px 10px;font-size:12.5px}
  #themeBtn{right:12px;bottom:12px;width:40px;height:40px}
}
</style>
<style id="glass-theme">/* ============================================================
   Nikon 玻璃主题 v2
   - 主界面：实底，不透明（可读性优先）
   - 二级菜单（抽屉）：半透明磨砂，体现层级
   - 保留尼康黄 / 黑识别色
   ============================================================ */
:root{
  --ios-ease: cubic-bezier(.32,.72,0,1);
  --ios-spring: cubic-bezier(.22,1.2,.36,1);
  --nikon-yellow: #f2c200;
  --nikon-black: #101216;
  --panel-solid: #ffffff;
  --panel-soft: #f7f8fa;
  --hair: rgba(16,24,40,.08);
}

html:not([data-theme="dark"]) body{
  background: #f4f5f7 !important;
}
html[data-theme="dark"] body{
  background: #0d1015 !important;
}

/* ---------- 顶栏：尼康黑 + 黄线，实底 ---------- */
.top{
  background: var(--nikon-black) !important;
  color: #fff !important;
  border-bottom: 3px solid var(--nikon-yellow) !important;
  box-shadow: 0 2px 10px rgba(0,0,0,.18);
  padding: 12px 22px 10px !important;
}
html[data-theme="dark"] .top{ background: #0a0c10 !important; }
.brand h1{ color:#fff !important; letter-spacing:-.2px; }
.brand p{ color:#9aa3af !important; }
.brand b{ color: var(--nikon-yellow) !important; }

/* 顶栏里的搜索框 */
#q{
  background: rgba(255,255,255,.10) !important;
  border: 1px solid rgba(255,255,255,.16) !important;
  color: #fff !important;
  border-radius: 12px !important;
  padding: 9px 14px !important;
  transition: background .2s var(--ios-ease), box-shadow .2s var(--ios-ease);
}
#q::placeholder{ color:#8f98a5 !important; }
#q:focus{
  background: rgba(255,255,255,.16) !important;
  box-shadow: 0 0 0 3px rgba(242,194,0,.35);
  outline: none;
}

/* ---------- 按钮 ---------- */
button, .btn{
  border-radius: 12px !important;
  border: 1px solid rgba(16,24,40,.10) !important;
  background: #fff !important;
  color: #15171c !important;
  font-weight: 500;
  padding: 8px 14px !important;
  box-shadow: 0 1px 2px rgba(16,24,40,.06);
  transition: transform .16s var(--ios-spring), background .2s var(--ios-ease), box-shadow .2s var(--ios-ease);
}
button:hover{ background: #f3f5f8 !important; }
button:active{ transform: scale(.96); }
button.primary{
  background: var(--nikon-yellow) !important;
  border-color: transparent !important;
  color: #111 !important;
  box-shadow: 0 4px 14px rgba(242,194,0,.35);
}
/* 顶栏内的按钮：深色 */
.top button{
  background: rgba(255,255,255,.10) !important;
  border-color: rgba(255,255,255,.18) !important;
  color:#fff !important;
  box-shadow:none;
}
.top button:hover{ background: rgba(255,255,255,.18) !important; }
.top button.primary{
  background: var(--nikon-yellow) !important;
  border-color: transparent !important;
  color:#111 !important;
}
html[data-theme="dark"] button{
  background:#1b212a !important; color:#e9edf3 !important; border-color: rgba(255,255,255,.10) !important;
}
html[data-theme="dark"] button:hover{ background:#232b36 !important; }

/* ---------- 导航：黑底分段控件，活动块黄 ---------- */
.nav{
  background: rgba(255,255,255,.10) !important;
  border-radius: 12px !important;
  padding: 3px !important;
  gap: 2px !important;
  width: fit-content;
  margin-bottom: 8px;
}
.nav a{
  border-radius: 9px !important;
  padding: 7px 14px !important;
  color: #b9c1cc !important;
  font-weight: 500;
  transition: background .2s var(--ios-ease), color .2s var(--ios-ease);
}
.nav a:hover{ background: rgba(255,255,255,.12) !important; color:#fff !important; }
.nav a.on{
  background: var(--nikon-yellow) !important;
  color: #111 !important;
  font-weight: 600;
  box-shadow: 0 1px 4px rgba(0,0,0,.25);
}
html[data-theme="dark"] .nav a.on{ background: var(--nikon-yellow) !important; color:#111 !important; }

/* ---------- 侧栏：实底白卡 ---------- */
#side{
  background: var(--panel-solid) !important;
  border: 1px solid var(--hair) !important;
  border-radius: 20px !important;
  box-shadow: 0 6px 20px rgba(16,24,40,.06) !important;
  padding: 18px !important;
}
html[data-theme="dark"] #side{
  background: #141a21 !important;
  border-color: rgba(255,255,255,.07) !important;
}
#side h3{ color:#6b7280 !important; letter-spacing:.06em; }
html[data-theme="dark"] #side h3{ color:#8b95a3 !important; }

/* ---------- chip ---------- */
.chip{
  border-radius: 999px !important;
  background: #eef0f4 !important;
  color:#15171c !important;
  padding: 6px 12px !important;
  font-weight: 500;
  border: 1px solid transparent !important;
  transition: transform .16s var(--ios-spring), background .2s var(--ios-ease);
}
.chip:hover{ background:#e3e7ee !important; }
.chip:active{ transform: scale(.95); }
.chip.on{
  background: var(--nikon-black) !important;
  color: #fff !important;
  box-shadow: 0 3px 10px rgba(16,24,40,.22);
}
html[data-theme="dark"] .chip{ background:#20262f !important; color:#dfe5ee !important; }
html[data-theme="dark"] .chip.on{ background: var(--nikon-yellow) !important; color:#111 !important; }

/* ---------- 分段控件 ---------- */
.seg{
  background:#eef0f4 !important;
  border-radius: 11px !important;
  padding: 3px !important;
  gap: 2px !important;
}
.seg button{
  border:none !important;
  background: transparent !important;
  box-shadow:none !important;
  border-radius: 8px !important;
  padding: 6px 10px !important;
  color:#4a515c !important;
}
.seg button.on{
  background:#fff !important;
  color:#111 !important;
  box-shadow: 0 1px 3px rgba(16,24,40,.14) !important;
}
html[data-theme="dark"] .seg{ background:#20262f !important; }
html[data-theme="dark"] .seg button{ color:#a9b3c0 !important; }
html[data-theme="dark"] .seg button.on{ background:#e9edf3 !important; color:#111 !important; }

/* ---------- 表格：实底 ---------- */
.wrap, .tablewrap{
  background: var(--panel-solid) !important;
  border: 1px solid var(--hair) !important;
  border-radius: 20px !important;
  box-shadow: 0 6px 20px rgba(16,24,40,.06) !important;
}
html[data-theme="dark"] .wrap, html[data-theme="dark"] .tablewrap{
  background:#141a21 !important; border-color: rgba(255,255,255,.07) !important;
}
thead th{ background:#fafbfc !important; }
html[data-theme="dark"] thead th{ background:#1a212a !important; }
tbody tr{ transition: background .16s var(--ios-ease); }
tbody tr:hover{ background: rgba(242,194,0,.10) !important; }
tbody td{ border-bottom: 1px solid rgba(16,24,40,.045) !important; }
html[data-theme="dark"] tbody td{ border-bottom-color: rgba(255,255,255,.06) !important; }

/* ---------- 相机页标签 ---------- */
.tabs{
  background:#eceef2 !important;
  border-radius: 12px !important;
  padding: 3px !important;
  width: fit-content;
  gap: 2px !important;
}
.tabs button{
  border:none !important;
  background: transparent !important;
  box-shadow:none !important;
  border-radius: 9px !important;
  padding: 7px 14px !important;
  color:#5a626e !important;
}
.tabs button.on{
  background:#fff !important;
  color:#111 !important;
  box-shadow: 0 1px 4px rgba(16,24,40,.12) !important;
}
html[data-theme="dark"] .tabs{ background:#20262f !important; }
html[data-theme="dark"] .tabs button{ color:#a9b3c0 !important; }
html[data-theme="dark"] .tabs button.on{ background:#e9edf3 !important; color:#111 !important; }

/* ---------- 二级菜单：居中悬浮的磨砂面板 ---------- */
.drawer{
  position: fixed !important;
  top: 0 !important;
  bottom: 0 !important;
  margin: auto 0 !important;
  right: calc(-1 * (min(560px, calc(100vw - 72px)) + 60px)) !important;
  height: min(880px, calc(100vh - 96px)) !important;
  width: min(560px, calc(100vw - 72px)) !important;
  border-radius: 22px !important;
  border: 1px solid rgba(255,255,255,.55) !important;
  background: rgba(255,255,255,.62) !important;
  -webkit-backdrop-filter: saturate(190%) blur(34px);
  backdrop-filter: saturate(190%) blur(34px);
  box-shadow: 0 30px 80px rgba(16,24,40,.26), 0 2px 8px rgba(16,24,40,.10) !important;
  transition: right .34s var(--ios-ease), opacity .22s var(--ios-ease), visibility .34s step-end !important;
  opacity: 0;
  visibility: hidden;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.drawer.on{
  right: 28px !important;
  opacity: 1;
  visibility: visible;
  transition: right .34s var(--ios-ease), opacity .22s var(--ios-ease), visibility 0s !important;
}
html[data-theme="dark"] .drawer{
  background: rgba(18,22,28,.66) !important;
  border-color: rgba(255,255,255,.10) !important;
  box-shadow: 0 30px 80px rgba(0,0,0,.6) !important;
}
.d-head{
  background: transparent !important;
  border-bottom: 1px solid rgba(16,24,40,.06) !important;
  border-radius: 22px 22px 0 0 !important;
}
html[data-theme="dark"] .d-head{ border-bottom-color: rgba(255,255,255,.08) !important; }
.d-head h2{ color: var(--ink) !important; letter-spacing:-.3px; }
.d-head p{ color: var(--muted) !important; }
.d-body{ border-radius: 0 0 22px 22px !important; }

/* 关闭按钮：严格居中 */
#m-close, .d-close{
  width:32px !important; height:32px !important; padding:0 !important;
  display:inline-flex !important; align-items:center !important; justify-content:center !important;
  border-radius:50% !important; line-height:0 !important;
  background: rgba(120,120,128,.16) !important; border:none !important; color: var(--ink) !important;
}
#m-close svg, .d-close svg{ display:block; margin:auto; }
#m-close:hover, .d-close:hover{ background: rgba(120,120,128,.26) !important; }

/* ---------- 深浅色切换按钮 ---------- */
#themeBtn{
  width:42px !important; height:42px !important; padding:0 !important;
  border-radius:50% !important;
  display:flex !important; align-items:center !important; justify-content:center !important;
  background:#fff !important; color:#111 !important;
  border:1px solid rgba(16,24,40,.12) !important;
  box-shadow: 0 6px 18px rgba(16,24,40,.16) !important;
  transition: transform .18s var(--ios-spring), background .2s var(--ios-ease);
}
#themeBtn svg{ display:block; }
#themeBtn .ico-sun{ display:none; }
html[data-theme="dark"] #themeBtn{ background:#1b212a !important; color:#e9edf3 !important; border-color: rgba(255,255,255,.14) !important; }
html[data-theme="dark"] #themeBtn .ico-moon{ display:none; }
html[data-theme="dark"] #themeBtn .ico-sun{ display:block; }
#themeBtn:active{ transform: scale(.9); }

/* ---------- 时间线 / 页脚 ---------- */
.g-head{ background:#fafbfc !important; }
html[data-theme="dark"] .g-head{ background:#1a212a !important; }
.g-lab{ background:#fff !important; }
html[data-theme="dark"] .g-lab{ background:#141a21 !important; }
.g-bar{ border-radius:6px !important; }
.g-row:hover .g-track{ background: rgba(242,194,0,.08); }

#site-footer{ border-top:1px solid rgba(16,24,40,.07) !important; }
html[data-theme="dark"] #site-footer{ border-top-color: rgba(255,255,255,.08) !important; }

/* ---------- 动效 ---------- */
@keyframes iosIn{ from{ opacity:0; transform: translateY(6px);} to{ opacity:1; transform:none;} }
.tablewrap, #side{ animation: iosIn .28s var(--ios-ease) both; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}

/* ---------- 移动端 ---------- */
@media (max-width: 640px){
  .top{ padding: 10px 14px 8px !important; }
  .tools{ flex-wrap: wrap; gap: 6px; width: 100%; }
  #q{ flex: 1 1 100%; width: 100% !important; max-width: none !important; }
  .nav{ width: 100%; }
  .nav a{ padding: 6px 10px !important; font-size: 12.5px !important; }
  #side{ border-radius: 16px !important; }
  .tablewrap{ border-radius: 16px !important; }
  .drawer{
    top: 12px !important; bottom: 12px !important; margin: 0 !important;
    right: -110vw !important; left: auto !important;

const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const state = {tab:"cam", q:""};
const COLS = {
  cam:[{k:"model",t:"相机型号"},{k:"series",t:"系列"},{k:"src",t:"来源"},{k:"url",t:"说明书"}],
  acc:[{k:"code",t:"配件型号"},{k:"type",t:"类型"},{k:"src",t:"来源"},{k:"url",t:"说明书"}]
};
function list(){ return state.tab==="cam" ? DATA.cams : DATA.accs; }
function render(){
  const cols = COLS[state.tab];
  $("#thead").innerHTML = cols.map(c=>`<th>${c.t}</th>`).join("");
  let rows = list().filter(d=>{
    if(!state.q) return true;
    return [d.model,d.code,d.series,d.type,d.src].join(" ").toLowerCase().includes(state.q);
  });
  $("#tbody").innerHTML = rows.map(d=>`<tr>
    <td class="model">${esc(d.model||d.code||"")}</td>
    <td>${esc(d.series||d.type||"—")}</td>
    <td><span class="tag">${esc(d.src||"—")}</span></td>
    <td>${d.url && d.url!=="—" ? `<a class="man" href="${esc(d.url)}" target="_blank" rel="noopener">打开说明书 →</a>` : '<span class="muted">—</span>'}</td>
  </tr>`).join("");
  $("#shown").textContent = rows.length;
  $("#all").textContent = list().length;
  $("#mini").textContent = `${DATA.cams.length} 台相机 / ${DATA.accs.length} 项配件`;
}
document.querySelectorAll(".tabs button").forEach(b=>{
  b.onclick = ()=>{ state.tab=b.dataset.tab; document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b)); render(); };
});
$("#q").oninput = e=>{ state.q=e.target.value.trim().toLowerCase(); render(); };
$("#reset").onclick = ()=>{ state.q=""; $("#q").value=""; render(); };
$("#csv").onclick = ()=>{
  const rows=list().filter(d=>!state.q || [d.model,d.code,d.series,d.type,d.src].join(" ").toLowerCase().includes(state.q));
  const head = state.tab==="cam" ? ["型号","系列","来源","说明书链接"] : ["配件型号","类型","来源","说明书链接"];
  const cell=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const body = rows.map(d=> state.tab==="cam"
    ? [d.model,d.series,d.src,d.url].map(cell).join(",")
    : [d.code,d.type,d.src,d.url].map(cell).join(","));
  const blob=new Blob(["\ufeff"+head.map(cell).join(",")+"\n"+body.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="说明书链接.csv"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
if(!DATA.cams.length && !DATA.accs.length){
  var eh=document.getElementById("empty-hint"); if(eh) eh.style.display="block";
}
$("#total").textContent = DATA.cams.length + DATA.accs.length;
render();
</script>

<script>
(function(){
  var K="nikkor-theme", root=document.documentElement;
  function apply(t){
    root.setAttribute("data-theme", t);
  }
  var saved=null;
  try{ saved=localStorage.getItem(K); }catch(e){}
  if(!saved){ saved = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
  apply(saved);
  window.addEventListener("DOMContentLoaded", function(){
    var b=document.getElementById("themeBtn");
    if(!b) return;
    b.onclick=function(){
      var t=root.getAttribute("data-theme")==="dark" ? "light" : "dark";
      apply(t);
      try{ localStorage.setItem(K,t); }catch(e){}
    };
  });
})();
</script>
