const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const state = {tab:"cam", q:""};
const COLS = {
  cam:[{k:"model",t:"相机型号"},{k:"series",t:"系列"},{k:"src",t:"来源"},{k:"url",t:"说明书"}],
  acc:[{k:"code",t:"配件型号"},{k:"type",t:"类型"},{k:"src",t:"来源"},{k:"url",t:"说明书"}]
};
function list(){ return state.tab==="cam" ? DATA.cams : DATA.accs; }
function render(){
  const cols = COLS[state.tab];
  $("#thead").innerHTML = cols.map(c=>`<th>${c.t}</th>`).join("");
  let rows = list().filter(d=>{
    if(!state.q) return true;
    return [d.model,d.code,d.series,d.type,d.src].join(" ").toLowerCase().includes(state.q);
  });
  $("#tbody").innerHTML = rows.map(d=>`<tr>
    <td class="model">${esc(d.model||d.code||"")}</td>
    <td>${esc(d.series||d.type||"—")}</td>
    <td><span class="tag">${esc(d.src||"—")}</span></td>
    <td>${d.url && d.url!=="—" ? `<a class="man" href="${esc(d.url)}" target="_blank" rel="noopener">打开说明书 →</a>` : '<span class="muted">—</span>'}</td>
  </tr>`).join("");
  $("#shown").textContent = rows.length;
  $("#all").textContent = list().length;
  $("#mini").textContent = `${DATA.cams.length} 台相机 / ${DATA.accs.length} 项配件`;
}
document.querySelectorAll(".tabs button").forEach(b=>{
  b.onclick = ()=>{ state.tab=b.dataset.tab; document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b)); render(); };
});
$("#q").oninput = e=>{ state.q=e.target.value.trim().toLowerCase(); render(); };
$("#reset").onclick = ()=>{ state.q=""; $("#q").value=""; render(); };
$("#csv").onclick = ()=>{
  const rows=list().filter(d=>!state.q || [d.model,d.code,d.series,d.type,d.src].join(" ").toLowerCase().includes(state.q));
  const head = state.tab==="cam" ? ["型号","系列","来源","说明书链接"] : ["配件型号","类型","来源","说明书链接"];
  const cell=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const body = rows.map(d=> state.tab==="cam"
    ? [d.model,d.series,d.src,d.url].map(cell).join(",")
    : [d.code,d.type,d.src,d.url].map(cell).join(","));
  const blob=new Blob(["\ufeff"+head.map(cell).join(",")+"\n"+body.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="说明书链接.csv"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
if(!DATA.cams.length && !DATA.accs.length){
  var eh=document.getElementById("empty-hint"); if(eh) eh.style.display="block";
}
$("#total").textContent = DATA.cams.length + DATA.accs.length;
render();
</script>
<button id="themeBtn" title="切换深色 / 浅色">🌙</button>
<script>
(function(){
  var K="nikkor-theme", root=document.documentElement;
  function apply(t){
    root.setAttribute("data-theme", t);
    var b=document.getElementById("themeBtn");
    if(b) b.textContent = t==="dark" ? "☀️" : "🌙";
  }
  var saved=null;
  try{ saved=localStorage.getItem(K); }catch(e){}
  if(!saved){ saved = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
  apply(saved);
  window.addEventListener("DOMContentLoaded", function(){
    var b=document.getElementById("themeBtn");
    if(!b) return;
    b.onclick=function(){
      var t=root.getAttribute("data-theme")==="dark" ? "light" : "dark";
      apply(t);
      try{ localStorage.setItem(K,t); }catch(e){}
    };
  });
})();
</script>

  if ('serviceWorker' in navigator) {

</script>
