const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const state = {q:"", brands:new Set(), sort:{k:"brand",dir:1}};

const COLS = [
  {k:"brand",t:"品牌",s:true},
  {k:"model",t:"型号",s:true,cls:"model"},
  {k:"focal",t:"焦段",s:true,cls:"num"},
  {k:"ap",t:"光圈",s:true,cls:"num"},
  {k:"af",t:"AF",s:false,cls:"hide-xs"},
  {k:"vr",t:"防抖",s:false,cls:"hide-xs"},
  {k:"optics",t:"结构",s:false,cls:"muted hide-sm"},
  {k:"filter",t:"口径",s:true,cls:"num hide-sm"},
  {k:"weight",t:"重量 g",s:true,cls:"num"},
  {k:"start",t:"发布",s:true,cls:"num hide-sm"}
];

function focalSpan(f){
  const m = String(f||"").match(/\d+(\.\d+)?/g);
  if(!m) return [9999,9999];
  return [parseFloat(m[0]), parseFloat(m[m.length-1])];
}
function num(v){ const m=String(v==null?"":v).match(/\d+(\.\d+)?/); return m?parseFloat(m[0]):null; }

// 品牌筛选
const brands = [...new Set(DATA.map(d=>d.brand))].sort();
brands.forEach(b=>{
  const c=document.createElement("span"); c.className="chip"; c.textContent=b; c.dataset.v=b;
  c.onclick=()=>{ state.brands.has(b)?state.brands.delete(b):state.brands.add(b); c.classList.toggle("on"); render(); };
  $("#brands").appendChild(c);
});

const thead=$("#thead");
COLS.forEach(c=>{
  const th=document.createElement("th");
  th.textContent=c.t; if(c.cls) th.className=c.cls.replace("model","").trim();
  th.dataset.k=c.k;
  th.onclick=()=>{ state.sort = state.sort.k===c.k ? {k:c.k,dir:-state.sort.dir} : {k:c.k,dir:1}; render(); };
  thead.appendChild(th);
});

$("#q").oninput=e=>{ state.q=e.target.value.trim().toLowerCase(); render(); };
$("#reset").onclick=()=>{ state.q=""; state.brands.clear(); $("#q").value=""; document.querySelectorAll(".chip.on").forEach(c=>c.classList.remove("on")); render(); };
document.addEventListener("keydown",e=>{ if(e.key==="/"&&document.activeElement!==$("#q")){e.preventDefault();$("#q").focus();} });

$("#csv").onclick=()=>{
  const rows=filtered();
  const head=["品牌","型号","世代","光圈类型","焦段","最大光圈","自动对焦","对焦马达","防抖","定位","特殊功能","外号","发布","停产","光学结构","滤镜口径","重量","备注"];
  const cell=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const body=rows.map(d=>[d.brand,d.model,d.gen,d.aptype,d.focal,d.ap,d.af,d.motor,d.vr,d.tier,d.feat,d.nick,d.start,d.end,d.optics,d.filter,d.weight,d.note].map(cell).join(","));
  const blob=new Blob(["\ufeff"+head.map(cell).join(",")+"\n"+body.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="尼康F卡口副厂镜头.csv"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

function filtered(){
  return DATA.filter(d=>{
    if(state.brands.size && !state.brands.has(d.brand)) return false;
    if(state.q){
      const hay=[d.brand,d.model,d.feat,d.note].join(" ").toLowerCase();
      if(!hay.includes(state.q)) return false;
    }
    return true;
  });
}
function render(){
  const rows=filtered();
  const {k,dir}=state.sort;
  rows.sort((a,b)=>{
    let x,y;
    if(k==="focal"){ x=focalSpan(a.focal)[0]*10000+focalSpan(a.focal)[1]; y=focalSpan(b.focal)[0]*10000+focalSpan(b.focal)[1]; }
    else if(k==="ap"||k==="weight"||k==="filter"){ x=num(a[k])||99999; y=num(b[k])||99999; }
    else if(k==="start"){ x=num(a[k])||9999; y=num(b[k])||9999; }
    else { x=String(a[k]||"").toLowerCase(); y=String(b[k]||"").toLowerCase(); }
    if(x<y) return -dir; if(x>y) return dir; return 0;
  });
  document.querySelectorAll("#thead th").forEach(th=>th.classList.toggle("sorted",th.dataset.k===k));
  $("#tbody").innerHTML=rows.map(d=>`<tr>
    <td><span class="tag">${esc(d.brand)}</span></td>
    <td class="model">${esc(d.model)}</td>
    <td class="num">${esc(d.focal)}</td>
    <td class="num">f/${esc(d.ap)}</td>
    <td class="hide-xs">${d.af==="是"?"是":"—"}</td>
    <td class="hide-xs">${d.vr==="是"?"是":"—"}</td>
    <td class="muted hide-sm">${esc(d.optics||"—")}</td>
    <td class="num hide-sm">${esc(d.filter||"—")}</td>
    <td class="num">${esc(d.weight||"—")}</td>
    <td class="num hide-sm">${esc(d.start||"—")}</td>
  </tr>`).join("");
  $("#shown").textContent=rows.length;
  $("#mini").textContent=`品牌 ${new Set(rows.map(d=>d.brand)).size} 个`;
}
$("#total").textContent=DATA.length;
$("#all").textContent=DATA.length;
render();
</script>
