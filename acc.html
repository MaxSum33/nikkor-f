<!doctype html>
<html lang="zh-CN">
<head>
<script>(function(){try{var t=localStorage.getItem("nikkor-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>相机配件 · 尼康 F 卡口资料库</title>
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#15171c;--muted:#69707d;--line:#e6e8ec;--accent:#f2c200;--chip:#eef0f3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.top{position:sticky;top:0;z-index:30;background:#111318;color:#fff;border-bottom:3px solid var(--accent);padding:12px 22px 10px}
.toprow{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-bottom:8px;min-height:56px}
.brand h1{font-size:17px;margin:0;font-weight:700;color:#fff}
.brand p{margin:2px 0 0;font-size:12px;color:#9aa3af}
.nav{display:flex;gap:2px;flex-wrap:wrap;background:rgba(255,255,255,.10);border-radius:12px;padding:3px;width:fit-content;margin-bottom:8px}
.nav a{color:#b9c1cc;text-decoration:none;font-size:13px;padding:7px 14px;border-radius:9px;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.12);color:#fff}
.nav a.on{background:var(--accent);color:#111;font-weight:600}
main{padding:16px 20px 24px}
.tabs{background:#eceef2;border-radius:12px;padding:3px;width:fit-content;display:inline-flex;gap:2px;margin-bottom:14px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:7px 14px;font:inherit;font-size:13px;color:#5a626e;cursor:pointer}
.tabs button.on{background:#fff;color:#111;font-weight:600;box-shadow:0 1px 4px rgba(16,24,40,.12)}
.sec{display:none}
.sec.on{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{background:var(--chip);border:1px solid transparent;border-radius:99px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:#4a515c}
.chip.on{background:#111;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.camcard{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid rgba(16,24,40,.08);border-radius:14px;padding:10px 12px;cursor:pointer;box-shadow:0 2px 10px rgba(16,24,40,.05)}
.camcard:hover{border-color:var(--accent)}
.camcard .ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#f1f3f6}
.camcard .nm{font-weight:600;font-size:13.5px}
.camcard .meta{font-size:11.5px;color:var(--muted)}
.camcard .cnt{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
.ico-cam{width:22px;height:22px;color:#4a515c}
.panel{background:var(--panel);border:1px solid rgba(16,24,40,.08);border-radius:20px;box-shadow:0 6px 20px rgba(16,24,40,.06);overflow:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
thead th{position:sticky;top:0;background:#fafbfc;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:11.5px;color:#555c68;white-space:nowrap}
tbody td{padding:8px 10px;border-bottom:1px solid #f0f1f3}
tbody tr{cursor:pointer}
tbody tr:nth-child(even){background:#fcfcfd}
tbody tr:hover{background:rgba(242,194,0,.10)}
.muted{color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
#q{width:240px;max-width:60vw;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px}
.stat{font-size:13px;color:var(--muted);margin:0 0 10px}
.stat b{font-size:18px;color:var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(12,14,18,.38);opacity:0;visibility:hidden;transition:opacity .2s;z-index:60}
.overlay.on{opacity:1;visibility:visible}
/* 二级抽屉：和镜头/相机一致 */
.drawer{position:fixed;top:0;bottom:0;margin:auto 0;right:-110vw;width:min(560px,calc(100vw - 72px));height:min(820px,calc(100vh - 96px));background:var(--panel);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.35);z-index:70;display:flex;flex-direction:column;transition:right .3s cubic-bezier(.22,.61,.36,1);border:1px solid rgba(16,24,40,.1)}
.drawer.on{right:24px}
.d-head{padding:16px 20px 12px;border-bottom:1px solid var(--line);position:relative}
.d-head h2{margin:0;font-size:17px}
.d-head p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.d-close{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:16px;line-height:1}
.d-body{flex:1;overflow:auto;padding:12px 20px 24px}
.d-kv{display:grid;grid-template-columns:86px 1fr;gap:8px 12px;font-size:13px;margin:0 0 14px}
.d-kv dt{color:var(--muted);font-size:12px}
.d-kv dd{margin:0}
.tree-g{margin:0 0 14px}
.tree-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;margin:0 0 6px;color:#2b303a}
.tree-h .n{font-weight:400;color:var(--muted);font-size:11.5px}
.tree-i{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:9px;cursor:pointer;font-size:12.5px}
.tree-i:hover{background:rgba(242,194,0,.12)}
.tree-i .fn{color:var(--muted);font-size:11.5px;margin-left:auto;text-align:right;max-width:52%}
/* 三级菜单：更小、更透、模糊更轻 */
#drawer3{
  position:fixed; right:-110vw; bottom:96px; z-index:80;
  width:min(400px, calc(100vw - 56px)); max-height:min(520px, calc(100vh - 140px));
  background:rgba(255,255,255,.70); backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px) saturate(1.2);
  border-radius:18px; box-shadow:0 18px 50px rgba(0,0,0,.22); border:1px solid rgba(16,24,40,.10);
  display:flex; flex-direction:column; transition:right .28s cubic-bezier(.22,.61,.36,1);
}
#drawer3.on{ right:24px; }
#drawer3 .d-head{ padding:12px 16px 9px; }
#drawer3 .d-head h2{ font-size:15px; }
#drawer3 .d-body{ padding:10px 16px 16px; font-size:12.5px; overflow:auto; }
#drawer3 .d-kv{ grid-template-columns:70px 1fr; gap:6px 10px; font-size:12px; margin-bottom:10px; }
.back{border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;margin-bottom:10px}
/* 深色 */
html[data-theme="dark"] body{background:#0d1015;color:#e7eaf0}
html[data-theme="dark"] .panel{background:#141a21;border-color:#252b35}
html[data-theme="dark"] .camcard{background:#141a21;border-color:#252b35}
html[data-theme="dark"] .camcard .ico{background:#20262f}
html[data-theme="dark"] .ico-cam{color:#a9b3c0}
html[data-theme="dark"] thead th{background:#1a212a;color:#a9b3c0;border-bottom-color:#252b35}
html[data-theme="dark"] tbody td{border-bottom-color:#222a34}
html[data-theme="dark"] tbody tr:nth-child(even){background:#171e26}
html[data-theme="dark"] tbody tr:hover{background:rgba(242,194,0,.10)}
html[data-theme="dark"] .chip{background:#20262f;color:#c6cdd8}
html[data-theme="dark"] .chip.on{background:#e9edf3;color:#111}
html[data-theme="dark"] .tabs{background:#20262f}
html[data-theme="dark"] .tabs button{color:#a9b3c0}
html[data-theme="dark"] .tabs button.on{background:#e9edf3;color:#111}
html[data-theme="dark"] .drawer{background:#12161c;border-color:#252b35}
html[data-theme="dark"] .d-head{border-bottom-color:#252b35}
html[data-theme="dark"] .d-close,html[data-theme="dark"] .back{background:#20262f;color:#e7eaf0;border-color:#2a323d}
html[data-theme="dark"] #q{background:#1b212a;color:#e7eaf0;border-color:#2a323d}
html[data-theme="dark"] .tree-i:hover{background:rgba(242,194,0,.14)}
html[data-theme="dark"] .tree-h{color:#dfe5ee}
html[data-theme="dark"] .muted,html[data-theme="dark"] .stat{color:#98a2b0}
/* 二级：玻璃质感（浅色 0.84 / 深色 0.46，模糊 26 / 34） */
body #drawer{ background:rgba(255,255,255,.84) !important; backdrop-filter:blur(26px) saturate(1.15) !important; -webkit-backdrop-filter:blur(26px) saturate(1.15) !important; }
html[data-theme="dark"] body #drawer{ background:rgba(18,22,28,.46) !important; backdrop-filter:blur(34px) saturate(1.3) !important; -webkit-backdrop-filter:blur(34px) saturate(1.3) !important; }
/* 三级：比二级更透、模糊更低（浅色 0.55 / 深色 0.20，模糊 8 / 10） */
body #drawer3{ background:rgba(255,255,255,.55) !important; backdrop-filter:blur(8px) saturate(1.05) !important; -webkit-backdrop-filter:blur(8px) saturate(1.05) !important; }
html[data-theme="dark"] body #drawer3{ background:rgba(18,22,28,.20) !important; backdrop-filter:blur(10px) saturate(1.1) !important; -webkit-backdrop-filter:blur(10px) saturate(1.1) !important; border-color:#2a323d; }
@media (max-width:720px){
  #q{width:100%;max-width:none}
  .drawer{width:calc(100vw - 32px);height:calc(100vh - 32px)}
  .drawer.on{right:16px}
  #drawer3{width:calc(100vw - 40px);bottom:84px}
  #drawer3.on{right:16px}
}
</style>
<style id="glass-theme">/* ============================================================
   Nikon 玻璃主题 v2
   - 主界面：实底，不透明（可读性优先）
   - 二级菜单（抽屉）：半透明磨砂，体现层级
   - 保留尼康黄 / 黑识别色
   ============================================================ */
:root{
  --ios-ease: cubic-bezier(.32,.72,0,1);
  --ios-spring: cubic-bezier(.22,1.2,.36,1);
  --nikon-yellow: #f2c200;
  --nikon-black: #101216;
  --panel-solid: #ffffff;
  --panel-soft: #f7f8fa;
  --hair: rgba(16,24,40,.08);
}

html:not([data-theme="dark"]) body{
  background: #f4f5f7 !important;
}
html[data-theme="dark"] body{
  background: #0d1015 !important;
}

/* ---------- 顶栏：尼康黑 + 黄线，实底 ---------- */
.top{
  background: var(--nikon-black) !important;
  color: #fff !important;
  border-bottom: 3px solid var(--nikon-yellow) !important;
  box-shadow: 0 2px 10px rgba(0,0,0,.18);
  padding: 12px 22px 10px !important;
}
html[data-theme="dark"] .top{ background: #0a0c10 !important; }
.brand h1{ color:#fff !important; letter-spacing:-.2px; }
.brand p{ color:#9aa3af !important; }
.brand b{ color: var(--nikon-yellow) !important; }

/* 顶栏里的搜索框 */
.top #q{
  background: rgba(255,255,255,.10) !important;
  border: 1px solid rgba(255,255,255,.16) !important;
  color: #fff !important;
  border-radius: 12px !important;
  padding: 9px 14px !important;
  transition: background .2s var(--ios-ease), box-shadow .2s var(--ios-ease);
}
.top #q::placeholder{ color:#8f98a5 !important; }
.top #q:focus{
  background: rgba(255,255,255,.16) !important;
  box-shadow: 0 0 0 3px rgba(242,194,0,.35);
  outline: none;
}

/* ---------- 按钮 ---------- */
button, .btn{
  border-radius: 12px !important;
  border: 1px solid rgba(16,24,40,.10) !important;
  background: #fff !important;
  color: #15171c !important;
  font-weight: 500;
  padding: 8px 14px !important;
  box-shadow: 0 1px 2px rgba(16,24,40,.06);
  transition: transform .16s var(--ios-spring), background .2s var(--ios-ease), box-shadow .2s var(--ios-ease);
}
button:hover{ background: #f3f5f8 !important; }
button:active{ transform: scale(.96); }
button.primary{
  background: var(--nikon-yellow) !important;
  border-color: transparent !important;
  color: #111 !important;
  box-shadow: 0 4px 14px rgba(242,194,0,.35);
}
/* 顶栏内的按钮：深色 */
.top button{
  background: rgba(255,255,255,.10) !important;
  border-color: rgba(255,255,255,.18) !important;
  color:#fff !important;
  box-shadow:none;
}
.top button:hover{ background: rgba(255,255,255,.18) !important; }
.top button.primary{
  background: var(--nikon-yellow) !important;
  border-color: transparent !important;
  color:#111 !important;
}
html[data-theme="dark"] button{
  background:#1b212a !important; color:#e9edf3 !important; border-color: rgba(255,255,255,.10) !important;
}
html[data-theme="dark"] button:hover{ background:#232b36 !important; }

/* ---------- 导航：黑底分段控件，活动块黄 ---------- */
.nav{
  background: rgba(255,255,255,.10) !important;
  border-radius: 12px !important;
  padding: 3px !important;
  gap: 2px !important;
  width: fit-content;
  margin-bottom: 8px;
}
.nav a{
  line-height: 1.5 !important;
  border-radius: 9px !important;
  padding: 7px 14px !important;
  color: #b9c1cc !important;
  font-weight: 500;
  transition: background .2s var(--ios-ease), color .2s var(--ios-ease);
}
.nav a:hover{ background: rgba(255,255,255,.12) !important; color:#fff !important; }
.nav a.on{
  background: var(--nikon-yellow) !important;
  color: #111 !important;
  font-weight: 600;
  box-shadow: 0 1px 4px rgba(0,0,0,.25);
}
html[data-theme="dark"] .nav a.on{ background: var(--nikon-yellow) !important; color:#111 !important; }

/* ---------- 侧栏：实底白卡 ---------- */
#side{
  background: var(--panel-solid) !important;
  border: 1px solid var(--hair) !important;
  border-radius: 20px !important;
  box-shadow: 0 6px 20px rgba(16,24,40,.06) !important;
  padding: 18px !important;
}
html[data-theme="dark"] #side{
  background: #141a21 !important;
  border-color: rgba(255,255,255,.07) !important;
}
#side h3{ color:#6b7280 !important; letter-spacing:.06em; }
html[data-theme="dark"] #side h3{ color:#8b95a3 !important; }

/* ---------- chip ---------- */
.chip{
  border-radius: 999px !important;
  background: #eef0f4 !important;
  color:#15171c !important;
  padding: 6px 12px !important;
  font-weight: 500;
  border: 1px solid transparent !important;
  transition: transform .16s var(--ios-spring), background .2s var(--ios-ease);
}
.chip:hover{ background:#e3e7ee !important; }
.chip:active{ transform: scale(.95); }
.chip.on{
  background: var(--nikon-black) !important;
  color: #fff !important;
  box-shadow: 0 3px 10px rgba(16,24,40,.22);
}
html[data-theme="dark"] .chip{ background:#20262f !important; color:#dfe5ee !important; }
html[data-theme="dark"] .chip.on{ background: var(--nikon-yellow) !important; color:#111 !important; }

/* ---------- 分段控件 ---------- */
.seg{
  background:#eef0f4 !important;
  border-radius: 11px !important;
  padding: 3px !important;
  gap: 2px !important;
}
.seg button{
  border:none !important;
  background: transparent !important;
  box-shadow:none !important;
  border-radius: 8px !important;
  padding: 6px 10px !important;
  color:#4a515c !important;
}
.seg button.on{
  background:#fff !important;
  color:#111 !important;
  box-shadow: 0 1px 3px rgba(16,24,40,.14) !important;
}
html[data-theme="dark"] .seg{ background:#20262f !important; }
html[data-theme="dark"] .seg button{ color:#a9b3c0 !important; }
html[data-theme="dark"] .seg button.on{ background:#e9edf3 !important; color:#111 !important; }

/* ---------- 表格：实底 ---------- */
.wrap, .tablewrap{
  background: var(--panel-solid) !important;
  border: 1px solid var(--hair) !important;
  border-radius: 20px !important;
  box-shadow: 0 6px 20px rgba(16,24,40,.06) !important;
}
html[data-theme="dark"] .wrap, html[data-theme="dark"] .tablewrap{
  background:#141a21 !important; border-color: rgba(255,255,255,.07) !important;
}
thead th{ background:#fafbfc !important; }
html[data-theme="dark"] thead th{ background:#1a212a !important; }
tbody tr{ transition: background .16s var(--ios-ease); }
tbody tr:hover{ background: rgba(242,194,0,.10) !important; }
tbody td{ border-bottom: 1px solid rgba(16,24,40,.045) !important; }
html[data-theme="dark"] tbody td{ border-bottom-color: rgba(255,255,255,.06) !important; }

/* ---------- 相机页标签 ---------- */
.tabs{
  background:#eceef2 !important;
  border-radius: 12px !important;
  padding: 3px !important;
  width: fit-content;
  gap: 2px !important;
}
.tabs button{
  border:none !important;
  background: transparent !important;
  box-shadow:none !important;
  border-radius: 9px !important;
  padding: 7px 14px !important;
  color:#5a626e !important;
}
.tabs button.on{
  background:#fff !important;
  color:#111 !important;
  box-shadow: 0 1px 4px rgba(16,24,40,.12) !important;
}
html[data-theme="dark"] .tabs{ background:#20262f !important; }
html[data-theme="dark"] .tabs button{ color:#a9b3c0 !important; }
html[data-theme="dark"] .tabs button.on{ background:#e9edf3 !important; color:#111 !important; }

/* ---------- 二级菜单：居中悬浮的磨砂面板 ---------- */
.drawer{
  position: fixed !important;
  top: 0 !important;
  bottom: 0 !important;
  margin: auto 0 !important;
  right: calc(-1 * (min(560px, calc(100vw - 72px)) + 60px)) !important;
  height: min(880px, calc(100vh - 96px)) !important;
  width: min(560px, calc(100vw - 72px)) !important;
  border-radius: 22px !important;
  border: 1px solid rgba(255,255,255,.55) !important;
  background: rgba(255,255,255,.62) !important;
  -webkit-backdrop-filter: saturate(190%) blur(34px);
  backdrop-filter: saturate(190%) blur(34px);
  box-shadow: 0 30px 80px rgba(16,24,40,.26), 0 2px 8px rgba(16,24,40,.10) !important;
  transition: right .34s var(--ios-ease), opacity .22s var(--ios-ease), visibility .34s step-end !important;
  opacity: 0;
  visibility: hidden;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.drawer.on{
  right: 28px !important;
  opacity: 1;
  visibility: visible;
  transition: right .34s var(--ios-ease), opacity .22s var(--ios-ease), visibility 0s !important;
}
html[data-theme="dark"] .drawer{
  background: rgba(18,22,28,.40) !important;
  border-color: rgba(255,255,255,.10) !important;
  box-shadow: 0 30px 80px rgba(0,0,0,.6) !important;
}
.d-head{
  background: transparent !important;
  border-bottom: 1px solid rgba(16,24,40,.06) !important;
  border-radius: 22px 22px 0 0 !important;
}
html[data-theme="dark"] .d-head{ border-bottom-color: rgba(255,255,255,.08) !important; }
.d-head h2{ color: var(--ink) !important; letter-spacing:-.3px; }
.d-head p{ color: var(--muted) !important; }
.d-body{ border-radius: 0 0 22px 22px !important; }

/* 关闭按钮：严格居中 */
#m-close, .d-close{
  width:32px !important; height:32px !important; padding:0 !important;
  display:inline-flex !important; align-items:center !important; justify-content:center !important;
  border-radius:50% !important; line-height:0 !important;
  background: rgba(120,120,128,.16) !important; border:none !important; color: var(--ink) !important;
}
#m-close svg, .d-close svg{ display:block; margin:auto; }
#m-close:hover, .d-close:hover{ background: rgba(120,120,128,.26) !important; }

/* ---------- 深浅色切换按钮 ---------- */
#themeBtn{
  width:42px !important; height:42px !important; padding:0 !important;
  border-radius:50% !important;
  display:flex !important; align-items:center !important; justify-content:center !important;
  background:#fff !important; color:#111 !important;
  border:1px solid rgba(16,24,40,.12) !important;
  box-shadow: 0 6px 18px rgba(16,24,40,.16) !important;
  transition: transform .18s var(--ios-spring), background .2s var(--ios-ease);
}
#themeBtn svg{ display:block; }
#themeBtn .ico-sun{ display:none; }
html[data-theme="dark"] #themeBtn{ background:#1b212a !important; color:#e9edf3 !important; border-color: rgba(255,255,255,.14) !important; }
html[data-theme="dark"] #themeBtn .ico-moon{ display:none; }
html[data-theme="dark"] #themeBtn .ico-sun{ display:block; }
#themeBtn:active{ transform: scale(.9); }

/* ---------- 时间线 / 页脚 ---------- */
.g-head{ background:#fafbfc !important; }
html[data-theme="dark"] .g-head{ background:#1a212a !important; }
.g-lab{ background:#fff !important; }
html[data-theme="dark"] .g-lab{ background:#141a21 !important; }
.g-bar{ border-radius:6px !important; }
.g-row:hover{ background: rgba(242,194,0,.10) !important; }

#site-footer{ border-top:1px solid rgba(16,24,40,.07) !important; }

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

const TYPE_ICON = {"取景器":"👁","闪光灯":"⚡","对焦屏":"▦","皮套":"🧳","遥控":"📶","电源":"🔌","电池":"🔋","其他":"▣","手柄/马达":"⚙","后背":"🎞"};
const icon = t => TYPE_ICON[t] || "▣";
const camIcon = series => /数码/.test(series) ? "ico-dslr" : (/自动胶片|IX/.test(series) ? "ico-af" : "ico-mf");

const BODIES = DATA.bodies;
const ACCS = DATA.accs;
const parts = DATA.parts;
const state = {series:new Set(), type:new Set(), q:""};

/* ---------- 系列 ---------- */
const seriesList = [];
BODIES.forEach(b=>{ if(seriesList.indexOf(b.series)<0) seriesList.push(b.series); });
$("#f-series").innerHTML = seriesList.map(x=>`<span class="chip" data-s="${esc(x)}">${esc(x)}</span>`).join("");
document.querySelectorAll("#f-series .chip").forEach(c=>{
  c.onclick = ()=>{ state.series.has(c.dataset.s)?state.series.delete(c.dataset.s):state.series.add(c.dataset.s);
    c.classList.toggle("on"); renderCams(); };
});

/* ---------- 机身列表 ---------- */
function renderCams(){
  const list = BODIES.filter(b=>!state.series.size || state.series.has(b.series));
  $("#camN").textContent = list.length;
  $("#camlist").innerHTML = list.map(b=>{
    const n = (ACCS[b.model]||[]).length;
    return `<div class="camcard" data-model="${esc(b.model)}">
      <div class="ico"><svg class="ico-cam"><use href="#${camIcon(b.series)}"></use></svg></div>
      <div><div class="nm">${esc(b.model)}</div><div class="meta">${esc(b.series)}${b.start?" · "+esc(b.start):""}</div></div>
      <div class="cnt">${n?n+" 件":"暂无"}</div>
    </div>`;
  }).join("");
  document.querySelectorAll(".camcard").forEach(el=>{ el.onclick = ()=>openCamTree(el.dataset.model); });
}

/* ---------- 二级：配件树 ---------- */
function openCamTree(model){
  const body = BODIES.find(b=>b.model===model) || {model};
  const items = ACCS[model] || [];
  const byType = {};
  items.forEach(a=>{ (byType[a.type] = byType[a.type]||[]).push(a); });
  const types = Object.keys(byType).sort((x,y)=>byType[y].length - byType[x].length);
  $("#d-title").textContent = body.model;
  $("#d-sub").textContent = `${body.series||""}${body.start?" · "+body.start:""} · ${items.length} 件原厂配件`;
  let h = "";
  if(!items.length) h = '<p class="muted">该机身暂无配件资料。</p>';
  types.forEach(t=>{
    h += `<div class="tree-g"><div class="tree-h">${icon(t)} ${esc(t)} <span class="n">${byType[t].length}</span></div>`;
    h += byType[t].map(a=>`<div class="tree-i" data-name="${esc(a.name)}"><span>${esc(a.name)}</span></div>`).join("");
    h += "</div>";
  });
  $("#d-body").innerHTML = h;
  document.querySelectorAll("#d-body .tree-i").forEach(el=>{
    el.onclick = ()=>openLv3(el.dataset.name);
  });
  $("#drawer").classList.add("on"); $("#ov").classList.add("on"); document.body.classList.add("drawer-open");
}

/* ---------- 三级：配件详情 ---------- */
function openLv3(name){
  const p = parts.find(x=>x.name===name); if(!p) return;
  $("#d3-title").textContent = p.name;
  $("#d3-sub").textContent = `${p.type} · ${p.models.length} 个机型可用`;
  $("#d3-body").innerHTML = `<dl class="d-kv"><dt>类型</dt><dd>${esc(p.type)}</dd><dt>功能</dt><dd>${esc(p.note||"—")}</dd></dl>`
    + `<div class="tree-h" style="margin-top:2px">适配机型</div><div style="display:flex;flex-wrap:wrap;gap:6px">`
    + p.models.map(m=>`<span class="chip" style="cursor:default">${esc(m)}</span>`).join("") + `</div>`;
  $("#drawer3").classList.add("on");
}

/* ---------- 配件清单 ---------- */
const typeList = [...new Set(parts.map(p=>p.type))].sort();
$("#f-type").innerHTML = typeList.map(t=>`<span class="chip" data-t="${esc(t)}">${icon(t)} ${esc(t)}</span>`).join("");
document.querySelectorAll("#f-type .chip").forEach(c=>{
  c.onclick = ()=>{ state.type.has(c.dataset.t)?state.type.delete(c.dataset.t):state.type.add(c.dataset.t);
    c.classList.toggle("on"); renderParts(); };
});
$("#q").oninput = e=>{ state.q = e.target.value.trim().toLowerCase(); renderParts(); };

function renderParts(){
  const list = parts.filter(p=>{
    if(state.type.size && !state.type.has(p.type)) return false;
    if(state.q){ const hay=(p.name+" "+(p.models||[]).join(" ")).toLowerCase(); if(!hay.includes(state.q)) return false; }
    return true;
  });
  $("#partN").textContent = list.length;
  $("#ptbody").innerHTML = list.map(p=>`<tr data-name="${esc(p.name)}"><td>${icon(p.type)} ${esc(p.name)}</td><td>${esc(p.type)}</td><td class="muted">${p.models.length} 个机型</td></tr>`).join("");
  document.querySelectorAll("#ptbody tr").forEach(tr=>{ tr.onclick = ()=>openPart(tr.dataset.name); });
}

function openPart(name){
  const p = parts.find(x=>x.name===name); if(!p) return;
  $("#d-title").textContent = p.name;
  $("#d-sub").textContent = `${p.type} · ${p.models.length} 个机型可用`;
  $("#d-body").innerHTML = `<button class="back" id="backBtn">← 返回配件树</button>`
    + `<dl class="d-kv"><dt>类型</dt><dd>${esc(p.type)}</dd><dt>功能</dt><dd>${esc(p.note||"—")}</dd></dl>`
    + `<div class="tree-h" style="margin-top:6px">适配机型</div><div style="display:flex;flex-wrap:wrap;gap:6px">`
    + p.models.map(m=>`<span class="chip" style="cursor:default">${esc(m)}</span>`).join("") + `</div>`;
  $("#backBtn").onclick = ()=>{ document.querySelectorAll(".tabs button")[0].click(); };
  $("#drawer").classList.add("on"); $("#ov").classList.add("on"); document.body.classList.add("drawer-open");
}

/* ---------- 关闭 ---------- */
function closeAll(){
  $("#drawer").classList.remove("on");
  $("#drawer3").classList.remove("on");
  $("#ov").classList.remove("on");
  document.body.classList.remove("drawer-open");
}
$("#d-close").onclick = closeAll;
$("#d3-close").onclick = ()=>$("#drawer3").classList.remove("on");
$("#ov").onclick = closeAll;
document.addEventListener("keydown", e=>{
  if(e.key!=="Escape") return;
  if($("#drawer3").classList.contains("on")) $("#drawer3").classList.remove("on");
  else closeAll();
});

/* ---------- 标签切换 ---------- */
document.querySelectorAll(".tabs button").forEach(b=>{
  b.onclick = ()=>{
    const bar = document.querySelector(".tabs");
    const idx = [].indexOf.call(bar.querySelectorAll("button"), b);
    const prev = +(bar.dataset.idx || 0);
    bar.dataset.idx = idx;
    bar.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b));
    document.querySelectorAll(".sec").forEach(s=>s.classList.toggle("on", s.id==="tab-"+b.dataset.tab));
    const target = document.querySelector(".sec.on");
    if(target){ target.classList.remove("anim-r","anim-l"); void target.offsetWidth; target.classList.add(idx>=prev?"anim-r":"anim-l"); }
  };
});

renderCams();
renderParts();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
/* 标签页滑动 */
(function(){
  try{
    document.addEventListener("click",function(e){
      var btn = e.target.closest ? e.target.closest(".tabs button") : null;
      if(!btn) return;
      var bar = btn.parentElement;
      var btns = [].slice.call(bar.querySelectorAll("button"));
      var idx = btns.indexOf(btn), prev = +(bar.dataset.idx || 0);
      bar.dataset.idx = idx;
      setTimeout(function(){
        var panes = [].slice.call(document.querySelectorAll("main section, main .sec"));
        var vis = panes.filter(function(p){ return getComputedStyle(p).display !== "none"; });
        var target = vis[vis.length - 1];
        if(!target) target = document.querySelector("main .tablewrap");
        if(!target) target = document.querySelector("main .wrap");
        if(!target) return;
        target.classList.remove("anim-r","anim-l");
        void target.offsetWidth;
        target.classList.add(idx >= prev ? "anim-r" : "anim-l");
      },0);
    },true);
  }catch(err){}
})();
</script>
