<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#15171c;--muted:#69707d;--line:#e6e8ec;--accent:#f2c200;--accent-soft:#fff6cc;--chip:#eef0f3;--shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.top{position:sticky;top:0;z-index:30;background:#111318;color:#fff;border-bottom:3px solid var(--accent);padding:10px 22px 0}
.toprow{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-bottom:8px}
.brand h1{font-size:17px;margin:0}
.brand p{margin:2px 0 0;font-size:12px;color:#a9b0bd}
.tools{display:flex;gap:8px;align-items:center}
#q{width:300px;max-width:52vw;padding:8px 12px;border-radius:9px;border:1px solid #2c313b;background:#1b1e25;color:#fff;outline:none;font-size:13px}
#q::placeholder{color:#7d8593}
.nav{display:flex;gap:2px;overflow:auto}
.nav a{color:#c8cdd6;text-decoration:none;font-size:13px;padding:8px 14px;border-radius:9px 9px 0 0}
.nav a:hover{background:#1b1e25}
.nav a.on{background:var(--bg);color:#111;font-weight:700}
main{padding:16px 20px 40px;max-width:1180px;margin:0 auto}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:#4b515c;font-size:13px;padding:7px 14px;border-radius:9px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.statline{display:flex;gap:10px;align-items:baseline;color:var(--muted);font-size:13px;margin-bottom:10px}
.statline b{font-size:20px;color:var(--ink)}
.wrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 250px)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
thead th{position:sticky;top:0;background:#fafbfc;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:11.5px;color:#555c68;white-space:nowrap}
tbody td{padding:8px 10px;border-bottom:1px solid #f0f1f3}
tbody tr:nth-child(even){background:#fcfcfd}
tbody tr:hover{background:var(--accent-soft)}
td.name{font-weight:600}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;background:var(--chip);color:#4a515c;white-space:nowrap}
a.rv{display:inline-flex;align-items:center;justify-content:center;height:22px;padding:0 11px;margin-right:4px;border-radius:99px;background:#1f4a73;color:#fff;text-decoration:none;font-size:11.5px;line-height:1;white-space:nowrap}
a.rv:hover{background:#2f6ba8}
a.rv.alt{background:#eef0f3;color:#3b414c}
.muted{color:var(--muted)}
.foot{margin:14px 2px 0;font-size:11.5px;color:var(--muted);line-height:1.7}
@media (max-width:640px){.hide-sm{display:none}#q{width:150px}}
</style>
</head>

</header>

<main>

</main>

const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
let tab="lens", q="";

document.querySelectorAll(".tabs button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); tab=b.dataset.tab; render();
  };
});
$("#q").oninput = e=>{ q=e.target.value.trim().toLowerCase(); render(); };

function bing(query, kind){
  const suffix = kind==="img" ? " 样张 sample images" : " review 评测";
  return "https://www.bing.com/search?q=" + encodeURIComponent(query + suffix);
}
function rows(){
  const src = tab==="lens" ? DATA.lenses : DATA.cams;
  const key = tab==="lens" ? "name" : "model";
  return src.filter(d=>{
    if(!q) return true;
    return [d[key], d.nick||"", d.gen||"", d.series||""].join(" ").toLowerCase().includes(q);
  });
}
function render(){
  $("#head").innerHTML = tab==="lens"
    ? '<th>镜头型号</th><th>世代</th><th class="hide-sm">年份</th><th>评测</th>'
    : '<th>机身型号</th><th>系列</th><th class="hide-sm">年份</th><th>评测</th>';
  const list = rows();
  $("#body").innerHTML = list.map(d=>{
    const name = tab==="lens" ? d.name : d.model;
    const mid  = tab==="lens" ? `<span class="tag">${esc(d.gen)}</span>` : `<span class="tag">${esc(d.series)}</span>`;
    const year = tab==="lens" ? d.year : d.start;
    const nick = d.nick && d.nick!=="无" && d.nick!=="—" ? `<span class="muted" style="font-size:11px"> ${esc(d.nick)}</span>` : "";
    return `<tr>
      <td class="name">${esc(name)}${nick}</td>
      <td>${mid}</td>
      <td class="hide-sm">${esc(year||"—")}</td>
      <td><a class="rv" href="${bing(name,"rev")}" target="_blank" rel="noopener">评测</a>
          <a class="rv alt" href="${bing(name,"img")}" target="_blank" rel="noopener">样张</a></td>
    </tr>`;
  }).join("");
  $("#shown").textContent = list.length;
  $("#hint").textContent = tab==="lens" ? "（379 支镜头）" : "（全部尼康 F 口机身）";
}
render();
